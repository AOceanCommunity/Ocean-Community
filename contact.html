<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Ocean Community</title>
<meta name="description" content="Get in touch with Ocean Community to suggest a stay or ask about the list.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --abyss:#061A2E; --current:#0E3E63; --foam:#EAF5FC;
    --flare:#2FA8E0; --sand:#BFE0F2; --line: rgba(234,245,252,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--abyss); color:var(--foam); font-family:'Sora', sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  .wrap{max-width:1200px; margin:0 auto; padding:0 28px;}
  h1{font-family:'Fraunces', serif; font-weight:600;}
  nav{position:sticky; top:0; z-index:50; background:rgba(6,26,46,0.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:18px 0;}
  nav .wrap{display:flex; align-items:center; justify-content:space-between;}
  .logo{font-family:'Fraunces', serif; font-style:italic; font-size:20px; text-decoration:none; display:inline-block;}
  .logo span{color:var(--flare); font-style:normal;}
  .navlinks{display:flex; gap:26px; font-size:14px;}
  .navlinks a{opacity:0.85; text-decoration:none;}
  .navlinks a:hover{opacity:1;}
  .navlinks a:focus-visible{outline:2px solid var(--flare); outline-offset:3px;}
  main{padding:56px 0 20px;}
  main h1{font-size:clamp(26px,3.6vw,40px); margin-bottom:24px;}
  main p{max-width:62ch; opacity:0.8; font-size:15px;}
  main a.mail{color:var(--flare); text-decoration:none; border-bottom:1px solid var(--flare);}
  footer{padding:56px 0 40px; border-top:1px solid var(--line); font-size:12px; opacity:0.5;}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="logo" href="index.html">Ocean <span>Community</span></a>
    <div class="navlinks">
      <a href="map.html">Our Eco Stays</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact</a>
    </div>
  </div>
</nav>

<main class="wrap">
  <h1>Contact</h1>
  <p>Know a place that belongs on this list, or run one yourself? Get in touch at <a class="mail" href="mailto:hello@oceancommunity.com">hello@oceancommunity.com</a>.</p>
</main>

<footer>
  <div class="wrap">© 2020 Ocean Community. Pure showcase. We do not process bookings or take a commission.</div>
</footer>
